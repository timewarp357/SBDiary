
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダンジョン検索</title>
  <script data-goatcounter="https://timewarp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>

  <h1>ダンジョン検索</h1>

  <input
    type="text"
    id="keyword"
    placeholder="キーワード検索"
  >

  <p id="count">読み込み中...</p>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ダンジョン</th>
          <th>フロア</th>
          <th>ボス</th>
          <th>リーダー（配置）</th>
          <th>Turn</th>
          <th>Auto</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>

  <script>
  const JSON_URL = './data.json';

  let allData = [];

  // 表示する列名
  const columnNames = [
    'ダンジョン',
    'フロア',
    'ボス',
    'リーダー（配置）',
    'Turn',
    'Auto'
  ];

  const keyword = document.getElementById('keyword');
  const results = document.getElementById('results');
  const count = document.getElementById('count');

  // JSONデータを取得
  async function loadData() {
    try {
      const response = await fetch(JSON_URL, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('JSON取得エラー');
      }

      allData = await response.json();

      render();

    } catch (error) {
      console.error(error);
      count.textContent = 'データ取得に失敗しました';
    }
  }

  // 検索・テーブル表示
  function render() {
    const q = keyword.value.trim().toLowerCase();

    const filtered = allData.filter(row => {
      return Object.values(row).some(value =>
        String(value).toLowerCase().includes(q)
      );
    });

    count.textContent = `${filtered.length}件`;

    results.replaceChildren();

    filtered.forEach(row => {
      const tr = document.createElement('tr');

      // JSONの0、1、2、3、8、9、10番目を左から順に表示
      const rowValues = Object.values(row);
      const values = [0, 1, 2, 3, 8, 9, 10].map(index => rowValues[index]);

      values.forEach(value => {
        const td = document.createElement('td');
        td.textContent = value ?? '';
        tr.appendChild(td);
      });

      results.appendChild(tr);
    });
  }

  keyword.addEventListener('input', render);

  loadData();
  </script>

</body>
</html>
