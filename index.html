
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">
  
  <title>SB Diary</title>

  <script data-goatcounter="https://timewarp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <header class="site-header" id="top" tabindex="-1">
    <h3 class="site-title">
      <a href="./index.html">SB Diary</a>
    </h3>

    <nav class="site-nav" aria-label="メインナビゲーション">
      <ul>
        <li><a href="./index.html" aria-current="page">Top</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-background">
    
    <!-- <h3>ダンジョン検索</h3> -->

    <div>
      <input
        type="search"
        id="keyword"
        placeholder="キーワード検索"
      >
      <span id="count">読み込み中...</span>
    </div>

    <div class="results-toolbar">
      <label class="auto-filter">
        <span>Autoフィルター</span>
        <input type="checkbox" id="filter-auto" role="switch">
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
      <div class="details-controls" role="group" aria-labelledby="details-label">
        <span id="details-label">編成</span>
        <button type="button" id="open-all">OPEN</button>
        <button type="button" id="close-all">CLOSE</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ダンジョン</th>
            <th>フロア</th>
            <th>ボス</th>
            <th>リーダー（配置）</th>
            <th>TURN</th>
            <th>AUTO</th>
            <th>MISSION</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <small class="site-footer-title">SB Diary</small>
    <a class="back-to-top" href="#top" aria-label="ページの先頭に戻る">↑ TOP</a>
  </footer>

  <script>
  const JSON_URL = './data.json';

  let allData = [];
  let autoOnly = false;

  // 表示する列名
  const columnNames = [
    'ダンジョン',
    'フロア',
    'ボス',
    'リーダー（配置）',
    'TURN',
    'AUTO',
    'MISSION'
  ];

  const keyword = document.getElementById('keyword');
  const results = document.getElementById('results');
  const count = document.getElementById('count');
  const filterAuto = document.getElementById('filter-auto');

  // JSONデータを取得
  async function loadData() {
    try {
      const response = await fetch(JSON_URL, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('JSON取得エラー');
      }

      allData = await response.json();

      render();

    } catch (error) {
      console.error(error);
      count.textContent = 'データ取得に失敗しました';
    }
  }

  // 検索・テーブル表示
  function render() {
    const q = keyword.value.trim().toLowerCase();

    const matched = allData.filter(row => {
      const rowValues = Object.values(row);
      // Auto列は表示時と同じくJSONの9番目（0始まり）を参照
      const hasAuto = String(rowValues[9] ?? '').trim() !== '';
      const matchesKeyword = q === '' || rowValues.some(value =>
        String(value ?? '').toLowerCase().includes(q)
      );
      return (!autoOnly || hasAuto) && matchesKeyword;
    });

    // 検索欄が空の場合は、絞り込み後の末尾15件を表示
    const filtered = q === '' ? matched.slice(-15) : matched;

    count.textContent = q === ''
      ? `${filtered.length}件（最新の15件を表示）`
      : `${filtered.length}件`;

    results.replaceChildren();

    filtered.forEach(row => {
      const tr = document.createElement('tr');

      // JSONの0、1、2、3、8、9、10番目を左から順に表示
      const rowValues = Object.values(row);
      const values = [0, 1, 2, 3, 8, 9, 10].map(index => rowValues[index]);
      const positions = String(rowValues[7] ?? '').split('');
      const formatMember = columnIndex => {
        const member = rowValues[columnIndex] ?? '';
        const position = positions[columnIndex - 3];
        return position === undefined ? String(member) : `${member} (${position})`;
      };

      values.forEach((value, index) => {
        const td = document.createElement('td');

        // 左から4番目（番号は0始まり）
        if (index === 3) {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          const content = document.createElement('div');

          summary.textContent = formatMember(3);

          [4, 5, 6].forEach(columnIndex => {
            const line = document.createElement('div');
            line.textContent = formatMember(columnIndex);
            content.appendChild(line);
          });

          details.appendChild(summary);
          details.appendChild(content);
          td.appendChild(details);
        } else if (index === 6) {
          // MISSIONは値がある場合に印を表示し、元の値は吹き出しにする
          if (value !== null && value !== undefined) {
            td.textContent = '詳細';
            td.title = String(value);
          }
        } else {
          td.textContent = value ?? '';
        }

        tr.appendChild(td);
      });

      results.appendChild(tr);
    });
  }

  keyword.addEventListener('input', render);

  filterAuto.addEventListener('change', () => {
    autoOnly = filterAuto.checked;
    render();
  });

  document.getElementById('open-all').addEventListener('click', () => {
    results.querySelectorAll('details').forEach(details => {
      details.open = true;
    });
  });

  document.getElementById('close-all').addEventListener('click', () => {
    results.querySelectorAll('details').forEach(details => {
      details.open = false;
    });
  });

  loadData();
  </script>

</body>
</html>
